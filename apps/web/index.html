<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7fa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PickNext" />
    <meta name="description" content="PickNext - 替你决定下一首会唱的歌" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>PickNext · 话筒递给我</title>
    <script>
      (() => {
        try {
          const mode = localStorage.getItem('picknext-theme');
          if (mode === 'light' || mode === 'dark') document.documentElement.dataset.theme = mode;
        } catch {
          // 浏览器禁用本地存储时继续使用系统主题。
        }
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
